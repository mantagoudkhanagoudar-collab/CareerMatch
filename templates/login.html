<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - CareerMatch</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <div class="logo">
            CareerMatch
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/register">Register</a>

        </div>

    </nav>


    <section class="form-section">

        <div class="form-card">

            <h1>Welcome Back</h1>

            <p>Login to your CareerMatch account.</p>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="form-footer">

                Don't have an account?

                <a href="/register">
                    Register
                </a>

            </p>

        </div>

    </section>

</body>

</html>
