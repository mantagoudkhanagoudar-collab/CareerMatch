<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - CareerMatch</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <div class="logo">
            CareerMatch
        </div>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/login">Login</a>

        </div>

    </nav>


    <section class="form-section">

        <div class="form-card">

            <h1>Create Account</h1>

            <p>
                Join CareerMatch today.
            </p>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST">

                <label>
                    Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <label>
                    Account Type
                </label>

                <select name="role" required>

                    <option value="job_seeker">
                        Job Seeker
                    </option>

                    <option value="recruiter">
                        Recruiter
                    </option>

                </select>


                <button type="submit">
                    Register
                </button>

            </form>


            <p class="form-footer">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </section>

</body>

</html>
